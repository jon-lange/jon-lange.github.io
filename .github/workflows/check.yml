name: check

# index.html and archive.html are generated and committed. The terminal's
# initial content must match its About template, and the archive must preserve
# the twelve historical entries and their source verdicts.
#
# GitHub Pages serves committed files directly, so drift must fail here.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  current:
    name: generated pages match their sources
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA. A tag is a pointer its owner can move.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: The check can fail before it is trusted
        # A --check that passes because it compared nothing prints what a clean
        # run prints. Break the output on purpose and require a non-zero exit,
        # then believe the clean run below.
        run: |
          set -e
          backup_dir=$(mktemp -d)
          cp index.html "$backup_dir/index.html"
          cp archive.html "$backup_dir/archive.html"
          trap 'cp "$backup_dir/index.html" index.html; cp "$backup_dir/archive.html" archive.html; rm -rf "$backup_dir"' EXIT
          python3 build.py --check
          for page in index.html archive.html; do
            printf '<!-- drift -->' >> "$page"
            if python3 build.py --check; then
              echo "BLOCKED - --check passed on a modified $page."
              echo "A clean result from it would mean nothing, so the build stops."
              exit 1
            fi
            cp "$backup_dir/$page" "$page"
          done
          echo "Self-test passed - --check detects drift in each generated page."

      - name: Both generated pages are current
        run: python3 build.py --check

      - name: The register still describes twelve entries
        # register.json is copied from the catalogue. If it is ever refreshed
        # into a different shape, the page would render silently wrong rather
        # than fail.
        run: |
          python3 - <<'PY'
          import json, sys
          rows = json.load(open("register.json"))
          verdicts = {"confirmed", "narrowed", "central-claim-failed"}
          bad = [r for r in rows if r.get("adj") not in verdicts]
          if len(rows) != 12 or bad:
              print(f"BLOCKED - {len(rows)} rows, {len(bad)} with an unknown verdict")
              sys.exit(1)
          if sorted(r.get("n", "") for r in rows) != [f"{n:02d}" for n in range(1, 13)]:
              print("BLOCKED - historical record identifiers must be 01–12 without duplicates")
              sys.exit(1)
          survived = sum(1 for r in rows if r["adj"] in ("narrowed", "confirmed"))
          print(f"12 entries, known verdicts; {survived} held or held with a narrowed claim")
          PY

