<svg xmlns="http://www.w3.org/2000/svg" width="358" height="520" viewBox="0 0 358 520" role="img" aria-labelledby="t d">
<title id="t">LangSpan: two agent sessions, shared context</title>
<desc id="d">An accessible vertical three-step illustration. First, Claude Code and Codex both intend to edit a ledger file. LangSpan reveals the overlapping intent. Codex then works on an independent test file and people review the combined work.</desc>
<style>
text{fill:#eeedf7;font-family:Arial,Helvetica,sans-serif}.micro{font:600 10px Arial,sans-serif;letter-spacing:1px;fill:#c1b7e6}.head{font:600 16px Arial,sans-serif}.sub{font:12px Arial,sans-serif;fill:#b8bbcd}.code{font:12px monospace;fill:#ddd5fc}.frame{fill:#272934;stroke:#4c4b62}.accent{stroke:#bdb1ff;stroke-width:1.5;fill:none}.cue{fill:#beb2f7;animation:cue 10s ease-in-out infinite}.arrow{stroke:#bdb1ff;stroke-width:2;fill:none;stroke-dasharray:4 5;animation:flow 2.5s linear infinite}@keyframes cue{0%,28%{opacity:.38}40%,74%{opacity:1}88%,100%{opacity:.5}}@keyframes flow{to{stroke-dashoffset:-36}}@media(prefers-reduced-motion:reduce){.cue{animation:none;opacity:1}.arrow{animation:none}}
</style>
