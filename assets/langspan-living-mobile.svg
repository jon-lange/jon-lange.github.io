<text x="51" y="151" font-size="13">Claude Code</text><text x="51" y="171" class="code">src/ledger.ts</text>
<rect x="21" y="194" width="316" height="57" rx="6" class="frame"/>
<circle cx="38" cy="222" r="5" fill="#9bd0b2"/>
<text x="51" y="217" font-size="13">Codex</text><text x="51" y="237" class="code">src/ledger.ts</text>
<path d="M178 259v22m-5-6 5 6 5-6" class="arrow"/>
<text x="22" y="302" class="micro">02 / LANGSPAN MAKES IT VISIBLE</text>
<rect x="21" y="316" width="316" height="60" rx="6" fill="#383443" stroke="#9f8bca"/>
