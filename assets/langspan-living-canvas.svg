<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
<title id="title">LangSpan — agents working with shared context</title>
<desc id="desc">Three steps: two agents plan an edit of the same file; LangSpan makes the overlap visible; separate files proceed toward review. Authored illustration.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e9e7f1}.mono{font-family:monospace}.kicker{font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#c8baff}.heading{font-size:21px;font-weight:600}.line{font-size:13px;fill:#bfc2ce}.soft{fill:#262832}.accent{stroke:#bdb1ff;fill:none;stroke-width:2}.signal{opacity:0;animation:signal 11s ease-in-out infinite}.flow{stroke-dasharray:7 9;animation:move 3s linear infinite}@keyframes signal{0%,25%{opacity:.25}34%,65%{opacity:1}85%,100%{opacity:.5}}@keyframes move{to{stroke-dashoffset:-32}}@media(prefers-reduced-motion:reduce){.signal{animation:none;opacity:1}.flow{animation:none}}</style>
<rect width="960" height="330" rx="14" fill="#191b22"/><path d="M320 28V302M640 28V302" stroke="#373944"/>
<text x="32" y="42" class="kicker">01 / TWO SESSIONS</text><text x="32" y="76" class="heading">An overlapping edit</text>
<rect x="32" y="101" width="255" height="54" rx="6" class="soft" stroke="#464857"/><circle cx="49" cy="128" r="5" fill="#d2baff"/><text x="63" y="125" font-size="13">Claude Code</text><text x="63" y="143" class="line mono">src/ledger.ts</text>
<rect x="32" y="171" width="255" height="54" rx="6" class="soft" stroke="#464857"/><circle cx="49" cy="198" r="5" fill="#aecab6"/><text x="63" y="195" font-size="13">Codex</text><text x="63" y="213" class="line mono">src/ledger.ts</text><text x="32" y="271" class="line">Both plan to touch the same file.</text>
<text x="352" y="42" class="kicker">02 / SHARED CONTEXT</text><text x="352" y="76" class="heading">Make the overlap visible</text>
<rect x="352" y="106" width="256" height="120" rx="8" class="soft" stroke="#66617e"/><path d="M375 137H399M387 125V149" stroke="#c8baff" stroke-width="2"/><text x="419" y="136" font-size="14">LangSpan</text><text x="419" y="157" class="line">Shared intent appears</text>
<rect x="373" y="173" width="214" height="29" rx="4" fill="#443b4f" stroke="#9c8ab4"/><text x="383" y="192" font-size="12">Overlap · src/ledger.ts</text><rect class="signal" x="372" y="171" width="216" height="33" rx="5" stroke="#d7c5fa" stroke-width="1.5" fill="none"/><text x="352" y="271" class="line">Relevant context reaches the session.</text>
<text x="672" y="42" class="kicker">03 / INDEPENDENT WORK</text><text x="672" y="76" class="heading">Continue with context</text>
<rect x="672" y="101" width="254" height="54" rx="6" class="soft" stroke="#464857"/><circle cx="690" cy="128" r="5" fill="#d2baff"/><text x="704" y="125" font-size="13">Claude Code</text><text x="704" y="143" class="line mono">src/ledger.ts</text>
<rect x="672" y="171" width="254" height="54" rx="6" class="soft" stroke="#4d7864"/><circle cx="690" cy="198" r="5" fill="#aecab6"/><text x="704" y="195" font-size="13">Codex</text><text x="704" y="213" class="line mono">tests/ledger.test.ts</text><text x="672" y="271" class="line">Work proceeds; people review the result.</text>
