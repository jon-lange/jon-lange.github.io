      <text x="76" y="443" fill="#8E8E88" font-size="19">− return session;</text>
      <rect x="64" y="461" width="604" height="45" rx="7" fill="#26362D"/>
      <text x="76" y="490" fill="#C0D7C9" font-size="19">+ return refreshSession(session);</text>
