    <text x="88" y="281" text-anchor="middle" fill="#151513" font-size="20" font-weight="700">A</text>
    <text x="120" y="282" fill="#F4F3EF" font-size="23" font-weight="600">Claude Code</text>
    <text x="660" y="281" text-anchor="end" fill="#B8B8AE" font-size="16">Session A</text>
    <text x="76" y="351" fill="#A1A1AA" font-size="18">Refresh session handling</text>
