  <template id="view-langspan">
    <div class="view-heading-row"><div><p class="eyebrow">THE FLAGSHIP / INDEPENDENT PROJECT</p><h1>LangSpan<span class="heading-dot">.</span></h1></div><span class="outline-badge">AGENT COORDINATION</span></div>
    <p class="view-lead">Run agents in parallel. Build as a team.</p><p class="muted">Your agents. On the same page. LangSpan is the open-source coordination layer for parallel agentic development.</p>
    <div class="section-intro"><h2>Parallel execution is easy. Coordinated development is hard.</h2><p>Worktrees isolate files, not intent. One agent can rename a function while another adds a caller using its old name. Git can merge both changes and the combined tests can still fail. <a class="text-link" href="https://langspan.dev/#why">Explore the clean-merge example.</a></p></div>
    <p class="scene-lead"><strong>One mechanism, step by step.</strong> For Claude Code and Codex in one checkout, LangSpan's hook refuses an edit that overlaps another session's hold, and says why. The agent decides what to do next.</p>
    <div data-langspan-stage data-stage-css="assets/langspan-stage.css" data-stage-js="assets/langspan-stage.js" class="langspan-stage-placeholder">
      <figure class="still-card"><img class="mark-on-dark" src="assets/langspan-card-dark-still.svg" alt="LangSpan illustration: in a shared checkout Agent A holds src/auth/session.ts, Agent B's overlapping request is refused, and B independently chooses tests/session.test.ts" width="1300" height="360"><img class="mark-on-light" src="assets/langspan-card-light-still.svg" alt="" width="1300" height="360"><figcaption>LangSpan's own illustration, from langspan.dev.</figcaption></figure>
    </div>
    <p class="caption">An illustration, not a recording. The refusal is quoted from a recorded Codex run in LangSpan's evidence, shortened where marked with "…"; the files are the example langspan.dev uses.</p>
    <div class="langspan-afterword">
      <p>LangSpan connects existing coding-agent sessions through relevant briefings, supported local edit checks, session ownership and exact-tree integration checks. It complements Git worktrees and keeps agent permissions intact. Opt-in Git metadata shares related activity across machines without publishing source contents.</p>
      <p class="muted">Claude Code and Codex connect through their hooks; adapters for Cursor, Gemini CLI and Antigravity exist but are not yet verified in live sessions. People set direction and review the combined result. The goal is compatible parallel work with less manual relay and avoidable rework; that outcome still needs comparative evidence. <a class="text-link" href="https://langspan.dev/#scale">Explore the illustrated 2, 6 and 10-session topology.</a></p>
    </div>
    <div class="action-row"><a class="button primary" href="https://langspan.dev/">Explore LangSpan</a><a class="button secondary" href="https://github.com/Langspan/LangSpan.dev/releases/tag/v0.1.0" target="_blank" rel="noopener">Download 0.1.0</a><a class="button secondary" href="https://github.com/Langspan/LangSpan.dev" target="_blank" rel="noopener">Source on GitHub</a></div>
    <p class="caption"><a class="text-link" href="https://langspan.dev/#evidence">Inspect recorded evidence</a></p>
    <p class="caption">LangSpan v0.1.0 is available for macOS and Linux. The animation above is an authored illustration of supported local coordination.</p>
  </template>
  <template id="view-botbench">
    <div class="view-heading-row"><div><p class="eyebrow">INDEPENDENT PROJECT / AGENT WORKBENCH</p><h1>Botbench<span class="heading-dot">.</span></h1></div><span class="outline-badge">LOCAL-FIRST</span></div>
    <p class="view-lead">Put your coding agents to work. Together.</p>
    <p class="muted">One workbench for your agents. One coordination layer for your team. Hand a task to Claude Code or Codex, walk away, and come back to a branch with its checks, a second vendor's review, and your decision.</p>
    <figure class="product-video">
      <video controls preload="none" playsinline poster="assets/botbench-demo-poster.png" width="1440" height="900" aria-describedby="botbench-video-caption"><source src="assets/botbench-demo.mp4" type="video/mp4"><a href="assets/botbench-demo.mp4">Download the 25-second demo (MP4)</a></video>
      <figcaption id="botbench-video-caption">The 25-second demo, no sound: a plan is approved, Claude Code fixes a bug, the repository's check and Codex's review come back, and the task is accepted. Recorded at 1440×900 at real speed; the agents' parts are replayed from recorded sessions.</figcaption>
    </figure>
    <div class="section-intro"><h2>When teammates' agents work the same repository.</h2><p>Each person keeps their own Mac, workbench and agents. Botbench tells you before your work collides, not when the second pull request opens.</p></div>
    <ul class="feature-list">
      <li><strong>Claim an issue</strong><span>Turn on issue claims for a repository and only one workbench takes an issue: the earliest claim goes ahead, and the other run stops and says who started first.</span></li>
      <li><strong>See the overlap</strong><span>On a task's Review tab, under the changed files: <q>office-mac's open pull request #12 also changes calc.py, so the two may conflict when both are merged.</q></span></li>
      <li><strong>Check together</strong><span>Merge your task with another workbench's open pull request in a temporary copy, and run the repository's own checks on the merge.</span></li>
      <li><strong>Ask a paired workbench</strong><span>Questions and answers between two paired workbenches. Every message that leaves is one its owner approved.</span></li>
    </ul>
    <figure class="still-card"><picture class="mark-on-dark"><source media="(max-width:600px)" srcset="assets/botbench-card-compact-still-dark.svg"><img src="assets/botbench-card-still-dark.svg" alt="Botbench illustration in the product's own words: a task ready for review, 1 of 1 check passed, Codex's review shown as a model's opinion, not a check, and under the changed file calc.py the line: office-mac's open pull request #12 also changes calc.py, so the two may conflict when both are merged" width="1200" height="689"></picture><picture class="mark-on-light"><source media="(max-width:600px)" srcset="assets/botbench-card-compact-still-light.svg"><img src="assets/botbench-card-still-light.svg" alt="" width="1200" height="689"></picture><figcaption>Botbench's own README card: an illustration in the product's words, not a recording.</figcaption></figure>
    <p class="caption">Coordination is early. Pairing has been tested with two installations on one Mac, one pairing per installation, questions and answers only. Botbench is macOS only, built from source, and never merges a pull request.</p>
